[package]
name = "chimitheque_back"
version = "0.1.0"
edition = "2024"
authors = ["Thomas Bellembois <thomas.bellembois@proton.me>"]
description = "Backend for Chimithèque"
license = "GPL-3.0"
repository = "https://github.com/tbellembois/chimitheque_back"
homepage = "https://github.com/tbellembois/chimitheque_back"
readme = "README.md"
categories = ["database", "science"]
keywords = ["chemistry", "biology", "database", "management"]
rust-version = "1.94.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = { version = "0.8", features = [ "macros" ]}
axum-extra = { version = "0.12.3", features = ["query"] }
casbin = { git = "https://github.com/casbin/casbin-rs.git", branch = "copilot/fix-db-connection-in-operator-function",  default-features = false, features = ["runtime-async-std", "logging", "incremental"] }
dashmap = "6.1.0"
dotenvy = "0.15"
erased-serde = "0.3.31"
governor = "0.10.4"
http = "1.4.0"
jsonwebtoken = {version="10.2.0", features=["rust_crypto"]}
once_cell = "1.21.3"
opentelemetry = "0.22"
opentelemetry-otlp = { version = "0.15", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.22", features = ["rt-tokio"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.25.0"
regex = "1.12.2"
rusqlite = { version = "0.32.0", features = ["load_extension", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.10.0", features = ["fs", "io-util", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["cors","trace"] }
tower-sessions = "0.14"
tracing = "0.1.44"
tracing-opentelemetry = "0.23"
tracing-subscriber = { version = "0.3.22", features=["env-filter", "json"] }
ureq = { version = "3", features = ["json"] }
url = "2.5.7"
uuid = "1.19.0"

chimitheque_types = { git = "https://github.com/tbellembois/chimitheque_types.git", branch = "main" }
chimitheque_traits = { git = "https://github.com/tbellembois/chimitheque_traits.git", branch = "main" }
chimitheque_utils = { git = "https://github.com/tbellembois/chimitheque_utils.git", branch = "main" }
chimitheque_db = { git = "https://github.com/tbellembois/chimitheque_db.git", branch = "main" }
chimitheque_pubchem = { git = "https://github.com/tbellembois/chimitheque_pubchem.git", branch = "main" }

[patch."https://github.com/tbellembois/chimitheque_types.git"]
chimitheque_types = { path = "../chimitheque_types" }

[patch."https://github.com/tbellembois/chimitheque_traits.git"]
chimitheque_traits = { path = "../chimitheque_traits" }

[patch."https://github.com/tbellembois/chimitheque_utils.git"]
chimitheque_utils = { path = "../chimitheque_utils" }

[patch."https://github.com/tbellembois/chimitheque_db.git"]
chimitheque_db = { path = "../chimitheque_db" }

[patch."https://github.com/tbellembois/chimitheque_pubchem.git"]
chimitheque_pubchem = { path = "../chimitheque_pubchem" }
